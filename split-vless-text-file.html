<html>
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VLESS文本分割</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.6.0/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <h1>VLESS文本分割</h1>
    <p>请输入文本文件的链接和分割份数，然后点击分割按钮。</p>
    <form id="form">
        <label for="url">文本文件链接:</label>
        <input type="url" id="url" name="url" placeholder="https://raw.githubusercontent.com/youfoundamin/V2rayCollector/main/vless_iran.txt"><br>
        <label for="parts">分割份数:</label>
        <input type="number" id="parts" name="parts" min="1" placeholder="8"><br>
        <button type="button" id="split">分割</button>
    </form>
    <div id="result"></div>
    <script>
        // 获取页面元素
        var form = document.getElementById("form");
        var url = document.getElementById("url");
        var parts = document.getElementById("parts");
        var split = document.getElementById("split");
        var result = document.getElementById("result");

        // 定义缺省的URL地址和缺省的分割份数
        var defaultUrl = "https://raw.githubusercontent.com/youfoundamin/V2rayCollector/main/vless_iran.txt";
        var defaultParts = 8;

        // 定义分割函数
        function splitText(text, n) {
            // 将文本按换行符分割为数组
            var lines = text.split("\n");
            // 计算每份的行数
            var linesPerPart = Math.ceil(lines.length / n)+1;
            // 创建一个空数组存储分割后的文本
            var texts = [];
            // 遍历数组，每次取出linesPerPart个元素，拼接为一个字符串，存入texts数组
            for (var i = 0; i < lines.length; i += linesPerPart) {
                var part = lines.slice(i, i + linesPerPart);
                // 如果最后一个元素包含vless字符串，那么将它移到下一份
                if (part[part.length - 1].includes("vless")) {
                    part.pop();
                    i--;
                }
                // 将分割后的文本拼接为一个字符串，加上换行符，存入texts数组
                var text = part.join("\n") + "\n";
                texts.push(text);
            }
            // 返回分割后的文本数组
            return texts;
        }

        // 定义过滤函数
        function filterText(text) {
            // 将文本按换行符分割为数组
            var lines = text.split("\n");
            // 创建一个空数组存储过滤后的文本
            var filtered = [];
            // 遍历数组，如果元素不为空，就将它存入filtered数组
            for (var line of lines) {
                if (line.trim() !== "") {
                    filtered.push(line);
                }
            }
            // 将过滤后的文本拼接为一个字符串，加上换行符，返回
            var text = filtered.join("\n") + "\n";
            return text;
        }

        // 定义压缩函数
        function zipTexts(texts) {
            // 创建一个新的JSZip对象
            var zip = new JSZip();
            // 遍历文本数组，为每个文本创建一个文件，命名为part-i.txt，其中i是索引
            for (var i = 0; i < texts.length; i++) {
                var text = texts[i];
                var filename = "vless-" + (i + 1) + ".txt";
                // 如果文本包含vless关键词，才将它压缩到zip文件里
                if (text.includes("vless")) {
                    // 调用过滤函数，删除空行
                    text = filterText(text);
                    zip.file(filename, text);
                }
            }
            // 生成一个zip文件对象
            var zipFile = zip.generateAsync({type:"blob"});
            // 返回zip文件对象
            return zipFile;
        }

        // 定义下载函数
        function downloadZip(zipFile) {
            // 使用FileSaver.js库的saveAs函数，将zip文件保存到本地，命名为split.zip
            saveAs(zipFile, "split.zip");
        }

        // 为分割按钮添加点击事件监听器
        split.addEventListener("click", function() {
            // 验证表单是否有效
            if (form.checkValidity()) {
                // 获取用户输入的链接和份数，如果没有输入，就使用缺省的值
                var link = url.value || defaultUrl;
                var n = parts.value || defaultParts;
                // 使用fetch函数获取文本文件的内容
                fetch(link)
                .then(function(response) {
                    // 如果响应成功，返回文本内容
                    if (response.ok) {
                        return response.text();
                    }
                    // 否则，抛出错误
                    else {
                        throw new Error("无法获取文本文件");
                    }
                })
                .then(function(text) {
                    // 调用分割函数，得到分割后的文本数组
                    var texts = splitText(text, n);
                    // 调用压缩函数，得到zip文件对象
                    return zipTexts(texts);
                })
                .then(function(zipFile) {
                    // 调用下载函数，将zip文件下载到本地
                    downloadZip(zipFile);
                    // 在结果区域显示成功信息
                    result.innerHTML = "<p>分割成功，zip文件已下载。</p>";
                })
                .catch(function(error) {
                    // 如果发生错误，显示错误信息
                    result.innerHTML = "<p>分割失败，错误信息：" + error.message + "</p>";
                });
            }
            // 否则，显示表单无效信息
            else {
                result.innerHTML = "<p>请正确填写表单。</p>";
            }
        });
    </script>
</body>
</html>
